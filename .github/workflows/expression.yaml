name: Using Expressions
run-name: Using expression | DEBUG - ${{ inputs.debug && 'ON' || 'OF' }}

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        required: false
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: '[Debug] Print start-up data'
        if: inputs.debug
        run: |
          echo "Debug mode is ON"
          echo "Workflow nam: ${{github.workflow}} "
          echo "Run ID: ${{github.run_id}} "
          echo "Run number: ${{github.run_number}} "
          echo "Event name: ${{github.event_name}} "
          echo "Actor: ${{github.actor}} "
          echo "Repository: ${{github.repository}} "
          echo "Branch: ${{github.ref}} " 
          echo "SHA: ${{github.sha}} "
      - name: '[Debug] Print when triggered from main'
        if: inputs.debug && github.ref_name == 'main'
        run: |
          echo "This workflow was triggered from the main branch"
      - name: Greeting
        run: |
          echo "Hello ${{ github.actor }}! Welcome to the Using Expressions workflow"